<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="https://use.typekit.net/kyc2pju.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nice docs</title>
    <!-- Before first paint: the reader's stored theme (ThemeToggle writes "nice-docs-theme"), else night. -->
    <script>
      try {
        document.documentElement.setAttribute("data-theme", localStorage.getItem("nice-docs-theme") === "day" ? "day" : "night")
      } catch {
        document.documentElement.setAttribute("data-theme", "night")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
